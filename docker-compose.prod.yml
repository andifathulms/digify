# Produksi. Tanpa hot reload, tanpa bind mount source, tanpa port database
# yang terbuka ke internet.
#
#   cp .env.example .env      # isi nilai produksi, DJANGO_DEBUG=0
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digify}
      POSTGRES_USER: ${POSTGRES_USER:-digify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sengaja TIDAK ada `ports:`. Database hanya bisa dihubungi dari dalam
    # jaringan Docker. Membukanya ke internet adalah cara tercepat kehilangan
    # seluruh data pelanggan.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digify}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    command: /app/entrypoint.prod.sh
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/mediafiles
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/digify.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot:/var/www/certbot
      - staticfiles:/var/www/static:ro
      - mediafiles:/var/www/media:ro
      # Taruh sertifikat TLS di sini (mis. hasil certbot di host).
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

  # Backup Postgres harian. Wajib ada sebelum jual publik (PRD §10).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-digify}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      PGDATABASE: ${POSTGRES_DB:-digify}
      SIMPAN_BACKUP_HARI: ${SIMPAN_BACKUP_HARI:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
  staticfiles:
  mediafiles:
  certbot:
