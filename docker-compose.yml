# Development. Hot reload aktif, source di-bind mount.
# Produksi memakai docker-compose.prod.yml.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digify}
      POSTGRES_USER: ${POSTGRES_USER:-digify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digify}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digify}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: /app/entrypoint.dev.sh
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      target: dev
    command: npm run dev
    env_file: [.env]
    environment:
      # URL yang dipakai server component di dalam jaringan Docker.
      BACKEND_INTERNAL_URL: http://backend:8000
      # Browser memanggil origin frontend sendiri (/api), lalu Next.js yang
      # meneruskannya ke Django sambil memasang token dari cookie httpOnly.
      # Tidak ada NEXT_PUBLIC_* berisi rahasia apa pun.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
