# Nginx produksi: satu domain untuk frontend dan API.
#
# Karena /api dilayani dari origin yang sama dengan halamannya, CORS tidak
# dipakai sama sekali di produksi.

upstream digify_frontend {
    server frontend:3000;
}

upstream digify_backend {
    server backend:8000;
}

# Semua http dialihkan ke https.
server {
    listen 80;
    server_name _;

    # Biarkan certbot bisa memverifikasi domain tanpa dialihkan.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Foto warung yang diunggah bisa besar; 0 = tanpa batas dari Nginx.
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Berkas statis Django (admin). Media user dilayani langsung juga.
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    location /admin/ {
        proxy_pass http://digify_backend;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # Webhook pembayaran masuk langsung ke Django, tidak lewat Next.js.
    location /api/webhooks/ {
        proxy_pass http://digify_backend;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # Seluruh sisa aplikasi, TERMASUK /api/*, dilayani Next.js. Next.js yang
    # meneruskan ke Django sambil memasang token dari cookie httpOnly
    # (lihat docs/DECISIONS.md).
    location / {
        proxy_pass http://digify_frontend;
        include /etc/nginx/snippets/proxy_headers.conf;

        # WAJIB: panggilan AI wajar memakan 10–30 detik dan kadang lebih.
        # Default Nginx 60 detik akan memutus request yang sebenarnya berhasil,
        # dan user melihat error padahal jawabannya sudah dihitung dan dibayar.
        proxy_connect_timeout 120s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
