# Header yang dipakai semua blok proxy.
#
# Ditaruh di snippets/, BUKAN conf.d/: berkas .conf di conf.d dimuat otomatis
# oleh Nginx sebagai konfigurasi tersendiri, dan isinya akan terpasang dua kali.
#
# X-Forwarded-Proto wajib ada: tanpa itu Django mengira request datang lewat
# http, lalu SECURE_SSL_REDIRECT mengalihkannya berputar tanpa henti.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
